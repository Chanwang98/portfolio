name: Kitchen Android APK
on:
  push:
    branches: [main]
    paths: ['recipes/**', 'kitchen-android/**', '.github/workflows/kitchen-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install and prepare Android
        working-directory: kitchen-android
        run: |
          npm ci
          npx cap sync android
      - name: Compile release APK
        working-directory: kitchen-android
        run: gradle -p android assembleRelease --no-daemon
      - name: Collect unsigned APK and signing tool
        run: |
          mkdir -p apk-output
          cp kitchen-android/android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/kitchen-unsigned.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          cp "$SIGNER" apk-output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-android-unsigned
          path: apk-output/*
          retention-days: 7
