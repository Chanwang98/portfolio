font-size:14px;font-weight:600;margin:16px 0}input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}textarea{resize:vertical;min-height:90px}label.field input,label.field textarea,label.field select{margin-top:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stepedit{background:#fff;border:1px solid var(--line);padding:18px;border-radius:18px;margin:14px 0}.stepedit .tools button{padding:5px 12px}.note{font-size:13px;line-height:1.7}.cook{max-width:700px;margin:auto}.cook .instruction{font-size:clamp(24px,5vw,34px);line-height:1.65;margin:24px 0}.cook .state{font-size:20px}.progress{height:5px;background:#dfe5d4;border-radius:10px;overflow:hidden;margin:18px 0}.progress i{display:block;background:var(--green);height:100%}.timer{font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:3px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:14px;z-index:10;max-width:90%;text-align:center}dialog{border:1px solid var(--line);border-radius:22px;padding:26px;width:min(90%,470px);color:var(--ink)}dialog::backdrop{background:#18312770}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}@media(max-width:700px){.wrap{padding:0 18px}header{padding:14px 0}main{padding-top:24px!important}.hero{grid-template-columns:1fr}.illustration{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:17px}.recipe{min-height:205px}.recipe h3{font-size:19px}.split{grid-template-columns:1fr}.bar .tag{display:none}.two{gap:10px}.dock button{flex:1;max-width:350px;min-width:0}.stepedit{padding:14px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}

<script>
'use strict';
const KEY='chan-kitchen-v1', DRAFT='chan-kitchen-draft-v1';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
let recipes=[],active=null,filter='全部',query='',draft=null,cookIndex=0,timerEnd=0,remaining=0,alarm=false,wake=null,saveError=false;
const MENU='chan-kitchen-menu-v1';
let todayOnly=false,menuIds=[],wakeWanted=false,wakePending=false,themeObserver=null;
const palettes={green:['青菜绿','#f2f6ed','#28452c','#62745e','#d7e2ce','#345d35','#e2edcf'],red:['番茄红','#fff5ef','#572f28','#876359','#ecd8cd','#9b4032','#f6dfd2'],gold:['南瓜金','#fff9e9','#514226','#82704d','#e8ddbd','#846019','#f4e7b9'],brown:['红烧棕','#f8f1e9','#4d352c','#836c5d','#e2d3c5','#805039','#ebdaca'],purple:['茄子紫','#f8f2fa','#48314e','#7c6583','#e3d6e8','#75477d','#ecddf0'],cream:['米饭白','#faf8f1','#454336','#777362','#e4e0d1','#656044','#eeead9']};
function dayKey(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let menuDay=dayKey();
try{let m=JSON.parse(localStorage.getItem(MENU));if(m?.date===menuDay&&Array.isArray(m.ids))menuIds=m.ids.filter(x=>typeof x==='string')}catch(e){}
function checkDay(){if(menuDay!==dayKey()){menuDay=dayKey();menuIds=[];}}
function colorOf(r){if(r?.color&&palettes[r.color])return r.color;let t=r?.title||'';if(/番茄|西红柿|辣椒|泡菜|红椒/.test(t))return 'red';if(/茄子|紫薯|紫甘蓝/.test(t))return 'purple';if(/南瓜|玉米|咖喱|蛋黄|土豆/.test(t))return 'gold';if(/红烧|酱|牛|排骨|煎|卤|肉/.test(t))return 'brown';if(/青菜|菠菜|西兰花|黄瓜|生菜|芹菜|沙拉/.test(t))return 'green';if(/米饭|豆腐|粥|银耳|清蒸/.test(t))return 'cream';return ({'🍅':'red','🥩':'brown','🍗':'brown','🍚':'cream','🥔':'gold','🍳':'gold'})[r?.icon]||'green'}
function applyTheme(r){let key=colorOf(r),p=palettes[key];['paper','ink','muted','line','green','lime'].forEach((v,i)=>document.documentElement.style.setProperty('--'+v,p[i+1]));document.querySelector('meta[name="theme-color"]').content=p[1];}
function observeRecipes(){themeObserver?.disconnect();let nodes=[...document.querySelectorAll('[data-recipe]')];if(!nodes.length){applyTheme(null);return}applyTheme(recipes.find(r=>r.id===nodes[0].dataset.recipe));themeObserver=new IntersectionObserver(entries=>{let visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(visible.length)applyTheme(recipes.find(r=>r.id===visible[0].target.dataset.recipe))},{rootMargin:'-110px 0px -55% 0px',threshold:0});nodes.forEach(n=>themeObserver.observe(n))}
function toggleMenu(id){checkDay();let next=menuIds.includes(id)?menuIds.filter(x=>x!==id):[...menuIds,id];try{localStorage.setItem(MENU,JSON.stringify({date:menuDay,ids:next}));menuIds=next;cards();toast(next.includes(id)?'已加入今日菜单':'已从今日菜单移除')}catch(e){toast('今日菜单保存失败，请检查浏览器存储')}}
function menuPanel(){checkDay();let chosen=menuIds.map(id=>recipes.find(r=>r.id===id)).filter(Boolean);$('#todayView').textContent='今天做这几道'+(chosen.length?' · '+chosen.length:'');$('#todayView').classList.toggle('mode-active',todayOnly);$('#allView').classList.toggle('mode-active',!todayOnly);return `<section class="menu-panel"><div class="row"><h3 style="margin:0">今天的餐桌 · ${chosen.length} 道菜</h3><span class="note">${menuDay}</span></div><p class="note">${chosen.length?'点菜名可定位，往下滚动也能看全部步骤。配色跟随正在看的菜。':'在菜谱标题旁点「＋ 今天做」，搭配今天的菜单。'}</p><div class="menu-pills">${chosen.map(r=>`<button data-jump="${esc(r.id)}">${esc(r.icon)} ${esc(r.title)}</button>`).join('')}</div>${todayOnly&&!chosen.length?'<button id="chooseDishes">去选择菜谱 →</button>':''}</section>`}
function wakeUI(message){$('#wakeBtn').setAttribute('aria-pressed',String(wakeWanted));$('#wakeBtn').textContent=wakeWanted?'☀ 关闭常亮':'☀ 保持常亮';$('#wakeStatus').textContent=message||(wake&&!wake.released?'屏幕常亮中':wakeWanted?'常亮已暂停，返回页面后重试':'常亮未开启')}
const sample={id:'sample-tomato',title:'番茄炒蛋',category:'家常菜',servings:2,icon:'🍅',ingredients:'番茄 2个\n鸡蛋 3个\n食用油 适量\n盐 适量\n葱花 少许',prep:'番茄洗净切块。\n鸡蛋打散，加少量盐。\n葱切末，调味料放在手边。',notes:'示例菜谱，可直接编辑或删除。火力与时间按锅具、食材量调整，以实际状态为准。',steps:[{text:'热锅倒油，加入蛋液，待边缘凝固后轻轻推散，盛出备用。',heat:'中火',seconds:60,state:'蛋液刚凝固，表面仍湿润，避免炒老。'},{text:'锅中补少量油，放入番茄翻炒，加入盐。',heat:'中火',seconds:180,state:'番茄变软、出汁，汁水明显增多。'},{text:'倒回鸡蛋，轻轻翻匀，让蛋块裹上番茄汁，撒葱花。',heat:'小火',seconds:45,state:'鸡蛋熟透、酱汁均匀包裹；尝味后出锅。'}],updated:Date.now()};
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').hidden=true,3200)}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));recipes=next;return true}catch(e){toast('保存失败：空间不足或浏览器限制，请先导出备份');return false}}
try{let raw=localStorage.getItem(KEY);recipes=raw?JSON.parse(raw):[sample];if(!Array.isArray(recipes))throw Error();}catch(e){saveError=true;recipes=[];}
function meta(r){return `${r.servings} 人份 · ${r.steps.length} 个步骤`}
function home(){active=null;stopTimer();$('#dock').hidden=true;$('#app').innerHTML=`<div class="hero"><div><span class="eyebrow">把每一次下厨，变成下一次的拿手菜</span><h1>好好做饭，<br>慢慢记下来。</h1><p>食材、备菜、火候与步骤，直接展开，随手往下看。</p></div><div class="illustration">🥬 🍳<small>A LITTLE HEAT. A LOT OF LOVE.</small></div></div><div class="row"><h2 style="margin:0">我的菜谱 <span class="tag">${recipes.length} 道</span></h2><button class="primary" id="newBtn">＋ 记一道菜</button></div><input class="search" id="search" placeholder="搜索菜名、食材或笔记…" aria-label="搜索菜谱" value="${esc(query)}"><div class="filters">${['全部','家常菜','增肌餐','汤与炖菜','主食','其他'].map(c=>`<button data-filter="${c}" class="${filter===c?'active':''}">${c}</button>`).join('')}</div><div id="menuPanel"></div><div id="cards" class="grid"></div><p class="note section">● 本机保存 · 记得定期导出备份${saveError?' · 原数据读取失败，请导入备份恢复':''}</p>`;$('#newBtn').onclick=()=>edit();$('#search').oninput=e=>{query=e.target.value;cards()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;home()});cards()}
function cards(){$('#menuPanel').innerHTML=menuPanel();let list=recipes.filter(r=>(!todayOnly||menuIds.includes(r.id))&&(filter==='全部'||r.category===filter)&&[r.title,r.ingredients,r.notes].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.updated-a.updated);$('#cards').innerHTML=list.length?list.map(r=>`<article class="fullrecipe" data-recipe="${esc(r.id)}"><div class="row recipehead"><div><span class="eyebrow">${esc(r.category)} · ${esc(meta(r))}</span><h2>${esc(r.icon)} ${esc(r.title)}</h2></div><div class="tools"><button data-menu="${esc(r.id)}" aria-pressed="${menuIds.includes(r.id)}" class="${menuIds.includes(r.id)?'soft':''}">${menuIds.includes(r.id)?'✓ 今天做 · 移除':'＋ 今天做'}</button><button data-edit="${esc(r.id)}">编辑</button></div></div><div class="split"><div><section class="card"><h3>01 / 食材清单</h3>${lines(r.ingredients).map(t=>`<label class="check"><input type="checkbox"><span>${esc(t)}</span></label>`).join('')||'<p>还没有记录食材</p>'}</section><section class="card section"><h3>02 / 备菜过程</h3>${lines(r.prep).map(t=>`<label class="check"><input type="checkbox"><span>${esc(t)}</span></label>`).join('')||'<p>还没有记录备菜</p>'}</section></div><div><h3>03 / 烹饪步骤 · 全部展开</h3>${r.steps.map((s,i)=>`<section class="step"><h3><span class="num">${i+1}</span><span class="chip">${esc(s.heat)}</span>${s.seconds?`<span class="chip">${duration(s.seconds)}</span>`:''}</h3><div class="pre">${esc(s.text)}</div>${s.state?`<div class="state">完成判断 · ${esc(s.state)}</div>`:''}</section>`).join('')}<section class="card section"><h3>心得 / 下次调整</h3><div class="pre">${esc(r.notes)||'还没有记录心得。'}</div></section><button class="soft" data-cook="${esc(r.id)}">逐步计时模式（可选） →</button></div></div></article>`).join(''):'<div class="empty">还没有匹配的菜谱。<br><span class="note">记下今天做的第一道菜吧。</span></div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{active=recipes.find(r=>r.id===b.dataset.edit);edit(active)});document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>{active=recipes.find(r=>r.id===b.dataset.cook);cookIndex=0;$('#dock').hidden=false;cook();if(wakeWanted)requestWake()});document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>toggleMenu(b.dataset.menu));document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{let id=b.dataset.jump;query='';filter='全部';$('#search').value='';cards();let node=[...document.querySelectorAll('[data-recipe]')].find(n=>n.dataset.recipe===id);node?.scrollIntoView({behavior:'smooth',block:'start'});applyTheme(recipes.find(r=>r.id===id))});if($('#chooseDishes'))$('#chooseDishes').onclick=()=>{todayOnly=false;home()};observeRecipes()}
function lines(s){return String(s).split('\n').filter(x=>x.trim())}
function detail(id){active=recipes.find(r=>r.id===id);if(!active)return home();stopTimer();releaseWake();const r=active;$('#app').innerHTML=`<button class="back" id="back">← 我的菜谱</button><div class="row"><span class="eyebrow">${esc(r.category)} / ${esc(r.servings)} 人份</span><button id="editBtn">编辑菜谱</button></div><h1>${esc(r.icon)} ${esc(r.title)}</h1><p>${esc(meta(r))} · 在自己的节奏里下厨</p><div class="split section"><div><section class="card"><h2>01 / 食材清单</h2>${lines(r.ingredients).map(t=>`<label class="check"><input type="checkbox"><span>${esc(t)}</span></label>`).join('')||'<p>还没有记录食材</p>'}</section><section class="card section"><h2>02 / 开火前</h2>${lines(r.prep).map(t=>`<label class="check"><input type="checkbox"><span>${esc(t)}</span></label>`).join('')||'<p>还没有备菜记录</p>'}</section></div><div><h2>03 / 烹饪步骤</h2>${r.steps.map((s,i)=>`<div class="step"><h3><span class="num">${i+1}</span><span class="chip">${esc(s.heat)}</span>${s.seconds?`<span class="chip">${duration(s.seconds)}</span>`:''}</h3><div class="pre">${esc(s.text)}</div>${s.state?`<div class="state">看锅里 · ${esc(s.state)}</div>`:''}</div>`).join('')}<section class="card section"><h3>下次会更好</h3><div class="pre">${esc(r.notes)||'在编辑中记下这次的心得。'}</div></section></div></div>`;$('#back').onclick=home;$('#editBtn').onclick=()=>edit(r);$('#dock').hidden=false;$('#dock').innerHTML='<button class="primary" id="cookBtn">开始下厨 →</button>';$('#cookBtn').onclick=()=>{cookIndex=0;cook();requestWake()};window.scrollTo(0,0)}
function duration(s){return s>=60?`${Math.floor(s/60)} 分${s%60?' '+s%60+' 秒':''}`:`${s} 秒`}
function blankStep(){return {text:'',heat:'中火',seconds:0,state:''}}
function edit(r){stopTimer();themeObserver?.disconnect();draft=r?JSON.parse(JSON.stringify(r)):{id:uid(),title:'',category:'家常菜',servings:2,icon:'🍲',ingredients:'',prep:'',notes:'',steps:[blankStep()]};if(!r){try{let saved=JSON.parse(localStorage.getItem(DRAFT));if(saved&&confirm('发现未完成的草稿，继续编辑吗？'))draft=saved}catch(e){}}renderEdit()}
function renderEdit(){ $('#dock').hidden=false;$('#dock').innerHTML='<span class="tag" id="draftStatus">编辑后自动存草稿</span><button class="primary" id="saveBtn">保存菜谱</button>';$('#app').innerHTML=`<div class="form"><button id="cancelEdit" class="back">← 返回</button><span class="eyebrow" style="display:block">RECIPE NOTEBOOK</span><h1>${recipes.some(r=>r.id===draft.id)?'把味道再完善一点。':'记一道，自己的菜。'}</h1><label class="field">菜名<input data-key="title" maxlength="80" placeholder="例如：香煎鸡腿排" value="${esc(draft.title)}"></label><div class="two"><label class="field">分类<select data-key="category">${['家常菜','增肌餐','汤与炖菜','主食','其他'].map(v=>`<option ${draft.category===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">用餐人数<input data-key="servings" type="number" min="1" max="99" value="${draft.servings}"></label></div><label class="field">菜谱图标<select data-key="icon">${['🍲','🍅','🥬','🍗','🥩','🍜','🍚','🥗','🐟','🍳','🥔','🥣'].map(v=>`<option ${draft.icon===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">菜品配色<select data-key="color"><option value="auto">自动匹配菜名 / 图标</option>${Object.entries(palettes).map(([k,v])=>`<option value="${k}" ${draft.color===k?'selected':''}>${v[0]}</option>`).join('')}</select><span class="note">也可以手动指定这道菜的颜色。</span></label><label class="field">食材与用量 · 每行一项<textarea data-key="ingredients" rows="4" placeholder="鸡腿 2只&#10;生抽 1勺">${esc(draft.ingredients)}</textarea></label><label class="field">备菜过程 · 每行一项<textarea data-key="prep" rows="3" placeholder="洗净切块、腌制、提前调好料汁…">${esc(draft.prep)}</textarea></label><h2 class="section">烹饪步骤</h2><div id="stepFields">${draft.steps.map((s,i)=>`<div class="stepedit"><div class="row"><h3 style="margin:0">步骤 ${i+1}</h3><div class="tools"><button data-move="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="步骤 ${i+1} 上移">↑</button><button data-move="${i}" data-dir="1" ${i===draft.steps.length-1?'disabled':''} aria-label="步骤 ${i+1} 下移">↓</button><button data-remove="${i}" class="danger" aria-label="删除步骤 ${i+1}">删除</button></div></div><label class="field">操作<textarea data-step="${i}" data-field="text" placeholder="下什么食材，怎么翻炒…">${esc(s.text)}</textarea></label><div class="two"><label class="field">火候<select data-step="${i}" data-field="heat">${['不开火','小火','中小火','中火','中大火','大火','关火'].map(v=>`<option ${v===s.heat?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">时间（秒，可留空）<input type="number" min="0" max="86400" data-step="${i}" data-field="seconds" value="${s.seconds||''}" placeholder="如 180 = 3分钟"></label></div><label class="field">锅内状态 / 完成判断<textarea data-step="${i}" data-field="state" placeholder="例如：边缘金黄，汤汁略浓，食材熟透">${esc(s.state)}</textarea></label></div>`).join('')}</div><button id="addStep" class="soft" style="width:100%">＋ 添加下一步</button><label class="field">心得与下次调整<textarea data-key="notes" placeholder="今天偏咸，下次少半勺生抽…">${esc(draft.notes)}</textarea></label>${recipes.some(r=>r.id===draft.id)?'<button id="deleteBtn" class="danger">删除这道菜谱</button>':''}</div>`;
 document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{draft[el.dataset.key]=el.dataset.key==='servings'?Number(el.value):el.value;applyTheme(draft);saveDraft()});document.querySelectorAll('[data-step]').forEach(el=>el.oninput=()=>{draft.steps[+el.dataset.step][el.dataset.field]=el.dataset.field==='seconds'?Number(el.value):el.value;saveDraft()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let i=+b.dataset.move,j=i+(+b.dataset.dir);[draft.steps[i],draft.steps[j]]=[draft.steps[j],draft.steps[i]];saveDraft();renderEdit()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(draft.steps.length===1)return toast('至少保留一个步骤');if(confirm('删除这个步骤？')){draft.steps.splice(+b.dataset.remove,1);saveDraft();renderEdit()}});$('#addStep').onclick=()=>{draft.steps.push(blankStep());saveDraft();renderEdit();$('#stepFields').lastElementChild.scrollIntoView({behavior:'smooth',block:'center'})};$('#saveBtn').onclick=saveRecipe;$('#cancelEdit').onclick=home;if($('#deleteBtn'))$('#deleteBtn').onclick=()=>{if(confirm('确定删除这道菜谱？建议先导出备份。')&&persist(recipes.filter(r=>r.id!==draft.id))){try{localStorage.removeItem(DRAFT)}catch(e){}home()}};
}
function saveDraft(){try{localStorage.setItem(DRAFT,JSON.stringify(draft));$('#draftStatus').textContent='草稿已保存'}catch(e){$('#draftStatus').textContent='草稿保存失败';toast('草稿未能保存，请导出备份后重试')}}
function saveRecipe(){if(!draft.title.trim())return toast('请填写菜名');if(!Number.isInteger(draft.servings)||draft.servings<1||draft.servings>99)return toast('人数需为 1–99 的整数');if(draft.steps.some(s=>!s.text.trim()))return toast('请填写每一步的操作');if(draft.steps.some(s=>!Number.isFinite(s.seconds)||s.seconds<0||s.seconds>86400))return toast('步骤时间需在 0–86400 秒之间');draft.title=draft.title.trim();draft.updated=Date.now();if(persist([...recipes.filter(r=>r.id!==draft.id),JSON.parse(JSON.stringify(draft))])){try{localStorage.removeItem(DRAFT)}catch(e){}home();toast('菜谱已保存')}}
async function requestWake(){if(!wakeWanted||wakePending||wake&&!wake.released)return;if(!('wakeLock'in navigator)){wakeWanted=false;wakeUI('浏览器不支持常亮，请调整系统自动锁定');return}wakePending=true;try{let lock=await navigator.wakeLock.request('screen');if(!wakeWanted){await lock.release();return}wake=lock;lock.addEventListener('release',()=>{if(wake===lock)wake=null;wakeUI()});wakeUI()}catch(e){wakeUI('常亮未生效，系统可能限制；可关闭后重试')}finally{wakePending=false}}
function releaseWake(){wakeWanted=false;let lock=wake;wake=null;if(lock)lock.release().catch(()=>{});wakeUI()}
$('#wakeBtn').onclick=()=>{if(wakeWanted)releaseWake();else{wakeWanted=true;wakeUI('正在开启常亮…');requestWake()}};
$('#allView').onclick=()=>{todayOnly=false;query='';filter='全部';home()};$('#todayView').onclick=()=>{todayOnly=true;query='';filter='全部';home()};
function stopTimer(){timerEnd=0;remaining=0;alarm=false}
function cook(){themeObserver?.disconnect();applyTheme(active);stopTimer();let s=active.steps[cookIndex];$('#app').innerHTML=`<div class="cook"><button id="exitCook">← 退出下厨</button><div class="row section"><span class="eyebrow">${esc(active.title)}</span><span>${cookIndex+1} / ${active.steps.length}</span></div><div class="progress"><i style="width:${(cookIndex+1)/active.steps.length*100}%"></i></div><span class="chip">${esc(s.heat)}</span><div class="instruction">${esc(s.text)}</div>${s.state?`<div class="state">完成判断<br>${esc(s.state)}</div>`:''}<section class="card section" style="text-align:center"><div class="note">${s.seconds?'参考计时 · 以实际熟度为准':'本步骤未设定计时'}</div><div id="clock" class="timer">${clock(s.seconds||0)}</div>${s.seconds?'<div class="tools" style="justify-content:center"><button class="soft" id="timerBtn">开始计时</button><button id="resetTimer">重置</button></div>':''}<p id="timerStatus" class="note" role="status">保持页面打开以接收提醒</p></section></div>`;remaining=s.seconds||0;$('#exitCook').onclick=home;if($('#timerBtn')){$('#timerBtn').onclick=toggleTimer;$('#resetTimer').onclick=()=>{stopTimer();remaining=s.seconds;$('#clock').textContent=clock(remaining);$('#timerBtn').textContent='开始计时';$('#timerStatus').textContent='保持页面打开以接收提醒'}}$('#dock').innerHTML=`<button id="prevStep" ${cookIndex===0?'disabled':''}>← 上一步</button><button class="primary" id="nextStep">${cookIndex===active.steps.length-1?'完成下厨 ✓':'下一步 →'}</button>`;$('#prevStep').onclick=()=>changeStep(-1);$('#nextStep').onclick=()=>{if(cookIndex===active.steps.length-1){if(timerEnd&&!confirm('计时仍在进行，确认完成下厨？'))return;home();toast('辛苦啦，好好享用这顿饭！')}else changeStep(1)};window.scrollTo(0,0)}
function changeStep(n){if(timerEnd&&!confirm('切换步骤将停止当前计时，继续吗？'))return;cookIndex+=n;cook()}
function clock(n){n=Math.max(0,Math.ceil(n));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function toggleTimer(){if(timerEnd){remaining=Math.max(0,(timerEnd-Date.now())/1000);timerEnd=0;$('#timerBtn').textContent='继续计时'}else{if(remaining<=0)remaining=active.steps[cookIndex].seconds;timerEnd=Date.now()+remaining*1000;alarm=false;$('#timerBtn').textContent='暂停';$('#timerStatus').textContent='计时进行中'}}
setInterval(()=>{if(!timerEnd||!$('#clock'))return;remaining=Math.max(0,(timerEnd-Date.now())/1000);$('#clock').textContent=clock(remaining);if(remaining===0){timerEnd=0;$('#timerBtn').textContent='重新计时';$('#timerStatus').textContent='时间到！检查锅内状态，再决定下一步。';toast('时间到了，看看锅里的状态');if(navigator.vibrate)navigator.vibrate([200,100,200]);}},250);
$('#backupBtn').onclick=()=>$('#settings').showModal();$('#closeSettings').onclick=()=>$('#settings').close();$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({format:'chan-kitchen',version:1,exported:new Date().toISOString(),recipes},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`锅边笔记-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast('已生成备份，请保存到文件')};$('#importBtn').onclick=()=>$('#importFile').click();
function validRecipe(r){return r&&typeof r.id==='string'&&r.id.length<200&&typeof r.title==='string'&&r.title.trim()&&typeof r.category==='string'&&typeof r.icon==='string'&&Number.isInteger(r.servings)&&r.servings>0&&r.servings<=99&&['ingredients','prep','notes'].every(k=>typeof r[k]==='string')&&Number.isFinite(r.updated)&&Array.isArray(r.steps)&&r.steps.length>0&&r.steps.length<500&&r.steps.every(s=>s&&typeof s.text==='string'&&typeof s.state==='string'&&typeof s.heat==='string'&&Number.isFinite(s.seconds)&&s.seconds>=0&&s.seconds<=86400)}
$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();let data=JSON.parse(await f.text());if(data.format!=='chan-kitchen'||data.version!==1||!Array.isArray(data.recipes)||!data.recipes.every(validRecipe))throw Error();if(!confirm(`导入 ${data.recipes.length} 道菜谱？同一菜谱保留更新时间较新的版本。`))return;let map=new Map(recipes.map(r=>[r.id,r]));for(let r of data.recipes){if(!map.has(r.id)||r.updated>map.get(r.id).updated)map.set(r.id,r)}if(persist([...map.values()])){$('#settings').close();home();toast('菜谱备份已合并')}}catch(e){toast('导入失败：请选择有效的锅边笔记 JSON 备份（5MB以内）')}finally{e.target.value=''}};
window.addEventListener('storage',e=>{if(e.key===KEY){toast('另一个页面更新了菜谱，请刷新后继续');}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&menuDay!==dayKey()&&$('#menuPanel'))cards();if(document.visibilityState==='visible'&&wakeWanted)requestWake()});home();
</script></body></html>
