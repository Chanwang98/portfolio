<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>访问数据中心 · Chan Wang</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="shell">
    <section class="auth-card" id="authCard">
      <div class="brand-mark">CW</div>
      <p class="eyebrow">PORTFOLIO ANALYTICS</p>
      <h1>访问数据中心</h1>
      <p class="muted">仅限管理员登录。首次使用请创建账号并完成邮箱验证。</p>
      <form id="authForm">
        <label>管理员邮箱
          <input id="email" type="email" value="wangyaochen963@126.com" autocomplete="email" required />
        </label>
        <label>密码
          <input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="至少 8 位" />
        </label>
        <button class="primary" type="submit">登录后台</button>
        <button class="secondary" id="signUpBtn" type="button">首次使用，创建账号</button>
        <button class="text-button" id="forgotPasswordBtn" type="button">忘记密码？发送重置邮件</button>
      </form>
      <form id="resetForm" hidden>
        <p class="recovery-copy">请设置新的管理员密码。保存后需要使用新密码重新登录。</p>
        <label>新密码
          <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="至少 8 位" />
        </label>
        <label>确认新密码
          <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="再次输入新密码" />
        </label>
        <button class="primary" type="submit">保存新密码</button>
        <button class="secondary" id="cancelResetBtn" type="button">取消</button>
      </form>
      <p class="message" id="authMessage" role="status"></p>
      <a class="back-link" href="../">← 返回个人主页</a>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">PORTFOLIO ANALYTICS</p>
          <h1>访问数据中心</h1>
          <p class="muted" id="updatedAt">正在加载最新数据…</p>
        </div>
        <div class="top-actions">
          <select id="rangeSelect" aria-label="统计时间范围">
            <option value="7">近 7 天</option>
            <option value="30" selected>近 30 天</option>
            <option value="90">近 90 天</option>
          </select>
          <button class="secondary compact" id="refreshBtn" type="button">刷新</button>
          <button class="ghost compact" id="logoutBtn" type="button">退出</button>
        </div>
      </header>

      <div class="stat-grid" aria-label="访问概览">
        <article class="stat-card live"><span>实时在线</span><strong id="onlineValue">—</strong><small><i></i> 90 秒内活跃</small></article>
        <article class="stat-card"><span>今日浏览量</span><strong id="todayValue">—</strong><small>页面访问次数</small></article>
        <article class="stat-card"><span>区间访客</span><strong id="visitorsValue">—</strong><small>脱敏去重访客</small></article>
        <article class="stat-card"><span>区间浏览量</span><strong id="viewsValue">—</strong><small>全部页面访问</small></article>
      </div>

      <div class="panel-grid">
        <article class="panel wide">
          <div class="panel-head"><div><h2>访问趋势</h2><p>浏览量与独立访客</p></div><div class="legend"><span class="views-dot"></span>浏览量 <span class="users-dot"></span>访客</div></div>
          <div class="chart" id="trendChart" aria-label="访问趋势图"></div>
        </article>
        <article class="panel">
          <div class="panel-head"><div><h2>访问时段</h2><p>按小时分布</p></div></div>
          <div class="hour-chart" id="hourChart"></div>
        </article>
        <article class="panel">
          <div class="panel-head"><div><h2>访客地区</h2><p>国家与城市</p></div></div>
          <div class="location-list" id="locationList"></div>
        </article>
      </div>

      <article class="panel table-panel">
        <div class="panel-head"><div><h2>最近访客</h2><p>仅显示脱敏 IP，不存储完整地址</p></div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>访问时间</th><th>位置</th><th>脱敏 IP</th><th>页面</th><th>设备 / 浏览器</th><th>停留状态</th></tr></thead>
            <tbody id="recentBody"></tbody>
          </table>
        </div>
      </article>
      <p class="dashboard-message" id="dashboardMessage" role="status"></p>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
